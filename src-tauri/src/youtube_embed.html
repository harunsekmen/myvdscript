<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>YouTube videosu</title>
  <style>
    html, body, iframe { margin: 0; width: 100%; height: 100%; border: 0; background: #000; }
    iframe { display: block; }
  </style>
</head>
<body>
  <iframe id="player" title="YouTube videosu" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>
  <script>
    const player = document.getElementById("player");
    const youtube = "https://www.youtube.com";
    window.addEventListener("message", (event) => {
      if (typeof event.data !== "string") return;
      if (event.source === window.parent && window.parent !== window) {
        player.contentWindow.postMessage(event.data, youtube);
      } else if (event.source === player.contentWindow && event.origin === youtube) {
        window.parent.postMessage(event.data, "*");
      }
    });
    const params = new URLSearchParams({
      enablejsapi: "1", controls: "0", rel: "0", fs: "0", disablekb: "1",
      cc_load_policy: "3", playsinline: "1", origin: window.location.origin
    });
    player.src = youtube + "/embed/VIDEO_ID?" + params;
  </script>
</body>
</html>
